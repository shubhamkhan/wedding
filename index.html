<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf6f0" />

    <title>Shubham & Anamika | Coming Soon</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;500;600&family=Poppins:wght@300;400&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #faf6f0;
        color: #514038;
        font-family: "Poppins", sans-serif;
        text-align: center;
        padding: 20px;
      }

      .container {
        width: 100%;
        max-width: 650px;
        padding: 65px 25px;
        border: 1px solid #dfc9ae;
        outline: 1px solid #dfc9ae;
        outline-offset: 7px;
        animation: fadeIn 1.5s ease;
      }

      .ornament {
        color: #b68a56;
        font-size: 27px;
        margin-bottom: 25px;
      }

      .subtitle {
        font-size: 11px;
        letter-spacing: 5px;
        text-transform: uppercase;
        color: #a17b53;
        margin-bottom: 25px;
      }

      h1 {
        font-family: "Great Vibes", cursive;
        font-size: clamp(55px, 10vw, 85px);
        font-weight: 400;
        color: #805b47;
        line-height: 1.2;
      }

      .ampersand {
        font-family: "Playfair Display", serif;
        font-size: 30px;
        color: #c19a6b;
        margin: 10px 0;
      }

      .divider {
        width: 70px;
        height: 1px;
        background: #c19a6b;
        margin: 35px auto;
      }

      h2 {
        font-family: "Playfair Display", serif;
        font-weight: 400;
        font-size: 25px;
        letter-spacing: 3px;
        color: #805b47;
        margin-bottom: 15px;
      }

      .description {
        font-size: 13px;
        color: #88776b;
        line-height: 2;
        font-weight: 300;
      }

      .footer {
        margin-top: 45px;
        font-size: 10px;
        letter-spacing: 3px;
        color: #a17b53;
        text-transform: uppercase;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(15px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 480px) {
        .container {
          padding: 55px 15px;
        }

        .subtitle {
          letter-spacing: 3px;
          font-size: 9px;
        }

        h2 {
          font-size: 20px;
        }
      }
    </style>
  </head>

  <body>
    <main class="container">
      <div class="ornament">❦</div>

      <p class="subtitle">A New Chapter Begins</p>

      <h1>Shubham</h1>

      <div class="ampersand">&</div>

      <h1>Anamika</h1>

      <div class="divider"></div>

      <h2>Something Beautiful<br />Is Coming Soon</h2>

      <p class="description">
        Two hearts, one journey, and a lifetime of memories.<br />
        We're preparing something special.
      </p>

      <div class="footer">With Love · Forever Begins</div>
    </main>
  </body>
</html>
